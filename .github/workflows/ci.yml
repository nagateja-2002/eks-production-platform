name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Publish an image to ECR and update the Helm tag (requires ENABLE_ECR_PUBLISH=true)"
        required: true
        default: false
        type: boolean

# Least privilege by default. The publish job adds only the permissions it needs.
permissions:
  contents: read

jobs:
  validate:
    name: Validate application, security, Terraform, and Helm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app_changed: ${{ steps.detect_changes.outputs.app_changed }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install application dependencies
        working-directory: app
        run: python -m pip install -r requirements.txt

      - name: Run application tests
        working-directory: app
        run: python -m pytest -q

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without configuring a backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Lint Helm chart
        run: helm lint helm/eks-production-platform

      - name: Render Helm templates
        run: helm template eks-production-platform helm/eks-production-platform --namespace eks-production

      - name: Detect application changes
        id: detect_changes
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
          fi

          if printf '%s\n' "$changed_files" | grep -qE '^app/'; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish ECR image and update GitOps tag
    needs: validate
    if: >-
      ${{
        vars.ENABLE_ECR_PUBLISH == 'true' &&
        (
          (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' &&
           inputs.publish_image == true) ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/main' &&
           needs.validate.outputs.app_changed == 'true')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: eks-production-platform

    steps:
      - name: Checkout source commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Check publishing configuration
        shell: bash
        env:
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          if [[ -z "$AWS_ROLE_TO_ASSUME" ]]; then
            echo "::error::Set the repository variable AWS_ROLE_TO_ASSUME to the intended AWS IAM role ARN."
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Build and push Docker image
        working-directory: app
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build -t "$image" .
          docker push "$image"
          docker tag "$image" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Update Helm image repository and tag
        env:
          GITHUB_SHA: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("helm/eks-production-platform/values.yaml")
          content = path.read_text(encoding="utf-8")
          registry = os.environ["ECR_REGISTRY"]
          sha = os.environ["GITHUB_SHA"]
          updates = [
              (
                  r'(?m)^  repository: .+$',
                  '  repository: "' + registry + '/eks-production-platform"',
                  "image repository",
              ),
              (
                  r'(?m)^  tag: "[^"]+"$',
                  '  tag: "' + sha + '"',
                  "image tag",
              ),
          ]
          for pattern, replacement, label in updates:
              content, count = re.subn(pattern, replacement, content, count=1)
              if count != 1:
                  raise SystemExit(f"Expected to update one {label}, found {count}")
          path.write_text(content, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/eks-production-platform/values.yaml

          if git diff --cached --quiet; then
            echo "Helm image repository and tag already match; no commit required."
          else
            git commit -m "chore: deploy image ${GITHUB_SHA} [skip ci]"
            git push origin HEAD:main
          fi
