replicaCount: 2

image:
  repository: 990787030729.dkr.ecr.ap-south-1.amazonaws.com/eks-production-platform
  tag: "1.0.0"
  pullPolicy: Always

deployment:
  name: fastapi-app

service:
  name: fastapi-service
  type: LoadBalancer
  port: 80
  targetPort: 8000

podDisruptionBudget:
  name: fastapi-pdb
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 5

  liveness:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 10
