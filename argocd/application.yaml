apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-production-platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nagateja-2002/eks-production-platform.git
    targetRevision: main
    path: helm/eks-production-platform

  destination:
    server: https://kubernetes.default.svc
    namespace: eks-production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true